name: 1. Send Free Mac to Private Repo

on:
  workflow_dispatch: # Lets you click "Run workflow" with 1 click
  repository_dispatch:
    types: [spawn-macos]

jobs:
  send-mac:
    runs-on: macos-latest # 100% Free Unlimited on Public Repo
    timeout-minutes: 60
    steps:
      - name: Download GitHub Runner for Mac (Apple Silicon)
        run: |
          mkdir actions-runner && cd actions-runner
          
          # Fetch latest runner release tag directly from GitHub redirect (No jq errors!)
          LATEST_TAG=$(curl -sI https://github.com/actions/runner/releases/latest | grep -i "^location:" | tr -d '\r' | awk -F'/' '{print $NF}')
          VERSION="${LATEST_TAG#v}"
          
          echo "Latest runner version detected: $VERSION"
          
          # Build direct download URL for Apple Silicon (ARM64)
          DOWNLOAD_URL="https://github.com/actions/runner/releases/download/${LATEST_TAG}/actions-runner-osx-arm64-${VERSION}.tar.gz"
          
          echo "Downloading from: $DOWNLOAD_URL"
          curl -o actions-runner-osx-arm64.tar.gz -L "$DOWNLOAD_URL"
          tar xzf ./actions-runner-osx-arm64.tar.gz

      - name: Connect This Mac to Private Repo
        env:
          PAT: ${{ secrets.RUNNER_ADMIN_PAT }}
          OWNER: sabariswaranabc804
          PRIVATE_REPO: book_my_games_Frontend
        run: |
          cd actions-runner

          # Ask Private Repo for a 1-time runner registration key
          REG_TOKEN=$(curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            https://api.github.com/repos/$OWNER/$PRIVATE_REPO/actions/runners/registration-token | jq -r .token)

          if [ "$REG_TOKEN" == "null" ] || [ -z "$REG_TOKEN" ]; then
            echo "Error: Failed to obtain registration token. Check your RUNNER_ADMIN_PAT permissions."
            exit 1
          fi

          # Connect to Private Repo with label 'cloud-mac' for 1 job (--ephemeral)
          ./config.sh \
            --url https://github.com/$OWNER/$PRIVATE_REPO \
            --token "$REG_TOKEN" \
            --name "free-mac-${{ github.run_id }}" \
            --labels "cloud-mac" \
            --ephemeral \
            --unattended

          # Run the Private Repo job, then automatically delete this runner
          ./run.sh

